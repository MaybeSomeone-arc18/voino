name: Publish reviewed Voino prototype

on:
  workflow_dispatch:
    inputs:
      archive_base64:
        description: Base64-encoded ZIP with reviewed Voino source files
        required: true
        type: string
      dry_run:
        description: Validate files and tests without committing
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: voino-prototype-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Validate archive, source and tests
        id: validate
        shell: bash
        env:
          ARCHIVE_B64: ${{ inputs.archive_base64 }}
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = main
          test -z "$(git status --porcelain)"
          printf '%s' "$ARCHIVE_B64" | base64 --decode > "$RUNNER_TEMP/voino.zip"
          python3 - "$RUNNER_TEMP/voino.zip" <<'PY'
          import sys, zipfile
          expected={'index.html','README.md','PITCH.md','package.json',
                    'src/app.js','src/board.js','src/notes.js','src/draw.js','src/style.css',
                    'tests/board.test.js','tests/draw.test.js','tests/notes.test.js'}
          with zipfile.ZipFile(sys.argv[1]) as archive:
              names={i.filename for i in archive.infolist() if not i.is_dir()}
              assert names == expected, f'Unexpected or missing files: {names ^ expected}'
              assert all(i.file_size <= 100000 for i in archive.infolist()), 'Oversized file'
              assert all(((i.external_attr >> 16) & 0o170000) != 0o120000 for i in archive.infolist()), 'Symlink not allowed'
              archive.extractall('.')
          PY
          git add index.html README.md PITCH.md package.json src tests
          test -n "$(git diff --cached --name-only)"
          if git diff --cached --name-only | grep -E '^\.github/'; then exit 1; fi
          npm test
          git diff --cached --check
          echo "file_count=$(git diff --cached --name-only | wc -l | tr -d ' ')" >> "$GITHUB_OUTPUT"
      - name: Commit and push tested source
        if: ${{ !inputs.dry_run }}
        id: push
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'MaybeSomeone-arc18'
          git config user.email 'sanskaraman15@gmail.com'
          git commit -m 'feat: add phone-first Voino prototype'
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push origin HEAD:refs/heads/main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Run summary
        if: always()
        shell: bash
        env:
          RESULT: ${{ job.status }}
          FILE_COUNT: ${{ steps.validate.outputs.file_count }}
          COMMIT_SHA: ${{ steps.push.outputs.sha }}
        run: |
          {
            echo '### Voino source publication'
            echo "- Result: $RESULT"
            echo "- Files staged: ${FILE_COUNT:-none}"
            echo "- Dry run: ${{ inputs.dry_run }}"
            echo "- Pushed commit: ${COMMIT_SHA:-none}"
            echo '- Validation: exact source file list, no symlinks, npm test, git diff --check'
          } >> "$GITHUB_STEP_SUMMARY"
