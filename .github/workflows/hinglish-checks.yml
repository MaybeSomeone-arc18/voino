name: Hinglish branch checks

on:
  push:
    branches: [hinglish-multilingual]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    if: github.ref == 'refs/heads/hinglish-multilingual'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Node API tests
        run: node --test tests/api.test.js
      - name: Flutter tests
        run: flutter test --reporter expanded
      - name: Build Flutter web preview
        run: flutter build web --release
      - name: Upload web preview
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: voino-web-preview-${{ github.sha }}
          path: build/web/
          if-no-files-found: error
          retention-days: 7
      - name: Build debug Android Test Store APK
        env:
          REVENUECAT_TEST_STORE_KEY: ${{ secrets.REVENUECAT_TEST_STORE_KEY }}
        run: |
          if [[ "$REVENUECAT_TEST_STORE_KEY" != test_* ]]; then
            echo 'Missing public Test Store SDK key in Actions secrets.' >&2
            exit 1
          fi
          flutter build apk --debug --dart-define="REVENUECAT_TEST_STORE_KEY=$REVENUECAT_TEST_STORE_KEY"
      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: voino-android-debug-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
